# Actions are working again. Branch protection still requires the
# `warden/gate` commit status (historically posted by local `warden` when
# Actions could not run). `.github/workflows/ci.yml` now publishes that
# status after CI succeeds so cloud-agent / Actions-only pushes can merge.
# Local `warden` with status.enabled remains valid for developer machines.
status:
  enabled: true

# warden gate — https://github.com/klarlabs-studio/warden
# Any dev with warden installed gets the same checks CI runs, pre-commit/pre-push.
hooks: { pre_commit: true, pre_push: true }
commands:
  # The gate that found the fleet-wide toolchain problem. It ran only in
  # GitHub Actions, and this repository no longer requires those checks —
  # so without this line, switching to warden/gate would delete it.
  vulns: "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."
  lint: "golangci-lint run ./..."
  test: "go test -race ./..."
steps:
  pre_commit: [lint]
  pre_push: [test, lint, vulns]
parallel: true
